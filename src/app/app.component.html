<div class="container-fluid">
  <!-- Navigation Header -->
  <nav class="navbar navbar-expand-lg navbar-dark" *ngIf="isAuthenticated">
    <div class="container">
      <a class="navbar-brand" routerLink="/dashboard">
        <i class="fas fa-stethoscope me-2"></i>
        Secrétaire Médicale
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto" *ngIf="currentPatient">
          <li class="nav-item">
            <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
              <i class="fas fa-home me-1"></i>
              Tableau de bord
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/appointments" routerLinkActive="active">
              <i class="fas fa-calendar-alt me-1"></i>
              Mes Rendez-vous
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/book-appointment" routerLinkActive="active">
              <i class="fas fa-plus-circle me-1"></i>
              Nouveau RDV
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/documents" routerLinkActive="active">
              <i class="fas fa-folder-medical me-1"></i>
              Mes Documents
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/payment-history" routerLinkActive="active">
              <i class="fas fa-receipt me-1"></i>
              Paiements
            </a>
          </li>
        </ul>

        <!-- Navigation pour utilisateurs non connectés -->
        <ul class="navbar-nav me-auto" *ngIf="!currentPatient">
          <li class="nav-item">
            <a class="nav-link" routerLink="/login">
              <i class="fas fa-sign-in-alt me-1"></i>
              Connexion
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/register">
              <i class="fas fa-user-plus me-1"></i>
              Inscription
            </a>
          </li>
        </ul>

        <ul class="navbar-nav">
          <li class="nav-item dropdown" *ngIf="currentPatient">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
              <i class="fas fa-user me-1"></i>
              {{ currentPatient.prenom }} {{ currentPatient.nom }}
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#"><i class="fas fa-user me-2"></i>Mon Profil</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" (click)="logout()" style="cursor: pointer;"><i class="fas fa-sign-out-alt me-2"></i>Déconnexion</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
