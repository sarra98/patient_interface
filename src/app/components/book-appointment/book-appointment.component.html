<div class="container py-4">
  <h3>Prise de rendez-vous</h3>

  <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
  <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

  <form (ngSubmit)="onSubmit()" #appointmentForm="ngForm">
    <div class="form-group mb-3">
      <label for="medecin_id">Médecin *</label>
      <select
        class="form-control"
        id="medecin_id"
        [(ngModel)]="appointmentData.medecin_id"
        name="medecin_id"
        required
      >
        <option value="">Sélectionnez un médecin</option>
        <option *ngFor="let m of medecins" [value]="m.id">Dr {{ m.prenom }} {{ m.nom }} - {{ m.specialite }}</option>
      </select>
      <small class="form-text text-muted" *ngIf="medecins.length === 0">
        Chargement des médecins...
      </small>
      <small class="form-text text-success" *ngIf="medecins.length > 0">
        {{ medecins.length }} médecin(s) disponible(s)
      </small>
    </div>

    <div class="form-group mb-3">
      <label for="date_rdv">Date et heure du rendez-vous *</label>
      <input
        type="datetime-local"
        class="form-control"
        id="date_rdv"
        [(ngModel)]="appointmentData.date_rdv"
        name="date_rdv"
        [min]="minDate + 'T08:00'"
        required
      />
      <small class="form-text text-muted">Choisissez une date et heure dans le futur</small>
    </div>

    <div class="form-group mb-3">
      <label for="motif">Motif de la consultation *</label>
      <input
        type="text"
        class="form-control"
        id="motif"
        [(ngModel)]="appointmentData.motif"
        name="motif"
        placeholder="Ex: Consultation générale, suivi..."
        required
      />
    </div>

    <div class="form-group mb-3">
      <label for="notes">Notes (optionnel)</label>
      <textarea
        class="form-control"
        id="notes"
        [(ngModel)]="appointmentData.notes"
        name="notes"
        rows="3"
        placeholder="Informations complémentaires..."
      ></textarea>
    </div>

    <button
      type="submit"
      class="btn btn-primary btn-lg"
      [disabled]="isLoading || !appointmentForm.form.valid"
    >
      <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
      {{ isLoading ? 'Création en cours...' : 'Confirmer le rendez-vous' }}
    </button>
  </form>
</div>
