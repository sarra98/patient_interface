<!DOCTYPE html>
<html>
<head>
    <title>Test Connexion</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px 0; }
        .error { color: red; margin: 10px 0; }
        .success { color: green; margin: 10px 0; }
        .info { background: #f8f9fa; padding: 10px; border-radius: 4px; margin: 10px 0; }
    </style>
</head>
<body>
    <h2>Test Connexion</h2>
    
    <div class="info">
        <strong>Compte de test:</strong><br>
        Email: test@example.com<br>
        Mot de passe: test123
    </div>
    
    <button onclick="testAuth()">Test Auth</button>
    
    <form id="loginForm">
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="test@example.com">
        </div>
        <div class="form-group">
            <label>Mot de passe:</label>
            <input type="password" id="password" value="test123">
        </div>
        <button type="submit">Se connecter</button>
    </form>
    
    <div id="message"></div>
    
    <script>
        async function testAuth() {
            try {
                const response = await fetch('/api/auth/test');
                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('message').innerHTML = 
                        '<div class="success">Auth OK: ' + result.patients_count + ' patients</div>';
                } else {
                    document.getElementById('message').innerHTML = 
                        '<div class="error">Auth Error: ' + result.error + '</div>';
                }
            } catch (error) {
                document.getElementById('message').innerHTML = 
                    '<div class="error">Erreur: ' + error.message + '</div>';
            }
        }
        
        document.getElementById('loginForm').onsubmit = async function(e) {
            e.preventDefault();
            
            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('message').innerHTML = 
                        '<div class="success">Connexion réussie! Patient: ' + result.patient.nom + '</div>';
                } else {
                    document.getElementById('message').innerHTML = 
                        '<div class="error">Erreur: ' + result.error + '</div>';
                }
            } catch (error) {
                document.getElementById('message').innerHTML = 
                    '<div class="error">Erreur connexion: ' + error.message + '</div>';
            }
        };
    </script>
</body>
</html>
