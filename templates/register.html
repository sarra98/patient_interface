<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Secrétaire Médicale</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-header h2 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            padding: 15px 40px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .btn-outline-secondary {
            border: 2px solid #6c757d;
            border-radius: 25px;
            padding: 15px 40px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .alert {
            border-radius: 10px;
            border: none;
            padding: 15px 20px;
            margin-bottom: 20px;
        }
        
        .section-title {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 15px 20px;
            border-radius: 10px;
            margin: 25px 0 20px 0;
            border-left: 4px solid #667eea;
        }
        
        .section-title h5 {
            margin: 0;
            color: #667eea;
            font-weight: 600;
        }
        
        .required {
            color: #dc3545;
        }
        
        .navbar {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
        }
        
        .navbar-brand {
            font-weight: 700;
            color: #667eea !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-stethoscope me-2"></i>
                Secrétaire Médicale
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/login">
                    <i class="fas fa-sign-in-alt me-1"></i>
                    Connexion
                </a>
                <a class="nav-link" href="/">
                    <i class="fas fa-home me-1"></i>
                    Accueil
                </a>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 80px;">
        <div class="form-container">
            <div class="form-header">
                <h2>
                    <i class="fas fa-user-plus me-2"></i>
                    Inscription Patient
                </h2>
                <p class="text-muted">Créez votre compte pour prendre rendez-vous avec le Dr Ahmed Samir</p>
            </div>

            <div id="message-container"></div>

            <form id="registrationForm">
                <div class="section-title">
                    <h5><i class="fas fa-user me-2"></i>Informations Personnelles</h5>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Prénom <span class="required">*</span></label>
                            <input type="text" class="form-control" id="prenom" name="prenom" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Nom <span class="required">*</span></label>
                            <input type="text" class="form-control" id="nom" name="nom" required>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email <span class="required">*</span></label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Téléphone <span class="required">*</span></label>
                    <input type="tel" class="form-control" id="telephone" name="telephone" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Date de naissance <span class="required">*</span></label>
                    <input type="date" class="form-control" id="date_naissance" name="date_naissance" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Adresse</label>
                    <textarea class="form-control" id="adresse" name="adresse" rows="3" placeholder="Adresse complète (optionnel)"></textarea>
                </div>

                <div class="section-title">
                    <h5><i class="fas fa-notes-medical me-2"></i>Informations Médicales</h5>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Antécédents médicaux</label>
                    <textarea class="form-control" id="antecedents_medicaux" name="antecedents_medicaux" rows="4" placeholder="Maladies, allergies, traitements en cours... (optionnel)"></textarea>
                </div>

                <div class="section-title">
                    <h5><i class="fas fa-phone me-2"></i>Contact d'urgence</h5>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Nom du contact d'urgence <span class="required">*</span></label>
                            <input type="text" class="form-control" id="contact_urgence_nom" name="contact_urgence_nom" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Téléphone d'urgence <span class="required">*</span></label>
                            <input type="tel" class="form-control" id="contact_urgence_telephone" name="contact_urgence_telephone" required>
                        </div>
                    </div>
                </div>

                <div class="section-title">
                    <h5><i class="fas fa-lock me-2"></i>Mot de passe</h5>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Mot de passe <span class="required">*</span></label>
                            <input type="password" class="form-control" id="password" name="password" required>
                            <small class="form-text text-muted">Minimum 6 caractères</small>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Confirmer le mot de passe <span class="required">*</span></label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary mb-3">
                        <i class="fas fa-user-plus me-2"></i>
                        Créer mon compte
                    </button>
                    <a href="/login" class="btn btn-outline-secondary">
                        <i class="fas fa-sign-in-alt me-2"></i>
                        J'ai déjà un compte
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageContainer = document.getElementById('message-container');
            
            // Collect form data
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });
            
            // Basic validation
            if (data.password !== data.confirm_password) {
                messageContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Les mots de passe ne correspondent pas.
                    </div>
                `;
                return;
            }
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    messageContainer.innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle me-2"></i>
                            Inscription réussie! Redirection vers la page de connexion...
                        </div>
                    `;
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    messageContainer.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            ${result.message || 'Erreur lors de l\'inscription'}
                        </div>
                    `;
                }
            } catch (error) {
                messageContainer.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Erreur de connexion. Veuillez réessayer.
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
