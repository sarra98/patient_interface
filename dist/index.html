<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Secrétaire Médicale - Gestion des Rendez-vous</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }
    
    .loading-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
    }
    
    .spinner-border {
      width: 3rem;
      height: 3rem;
    }
    
    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
      border: none;
      border-radius: 25px;
      padding: 10px 25px;
      font-weight: 500;
    }
    
    .alert {
      border-radius: 10px;
      border: none;
      padding: 15px 20px;
    }
    
    .alert-info {
      background: linear-gradient(135deg, rgba(23, 162, 184, 0.1) 0%, rgba(19, 132, 150, 0.1) 100%);
      color: #0c5460;
      border-left: 4px solid #17a2b8;
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="card text-center p-5">
      <div class="card-body">
        <i class="fas fa-stethoscope fa-4x text-primary mb-4"></i>
        <h2 class="mb-3">Secrétaire Médicale</h2>
        <p class="lead text-muted mb-4">Gestion des Rendez-vous Médicaux</p>
        
        <div class="alert alert-info mb-4">
          <i class="fas fa-info-circle me-2"></i>
          <strong>Application en cours de chargement...</strong>
        </div>
        
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Chargement...</span>
        </div>
        
        <div class="mt-4">
          <h5>Fonctionnalités</h5>
          <div class="row mt-3">
            <div class="col-md-4">
              <i class="fas fa-user-plus fa-2x text-primary mb-2"></i>
              <p>Inscription Patient</p>
            </div>
            <div class="col-md-4">
              <i class="fas fa-calendar-plus fa-2x text-primary mb-2"></i>
              <p>Prise de RDV</p>
            </div>
            <div class="col-md-4">
              <i class="fas fa-user-md fa-2x text-primary mb-2"></i>
              <p>Dr Ahmed Samir</p>
            </div>
          </div>
        </div>
        
        <div class="mt-4">
          <p class="small text-muted">
            Si l'application ne se charge pas automatiquement, 
            <a href="/api/health" class="text-primary">vérifiez l'état du serveur</a>
          </p>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Try to redirect to the actual Angular app after a delay
    setTimeout(() => {
      fetch('/api/health')
        .then(response => response.json())
        .then(data => {
          if (data.status === 'healthy') {
            // Server is running, show success message
            document.querySelector('.alert').innerHTML = 
              '<i class="fas fa-check-circle me-2"></i><strong>Serveur actif!</strong> Vous pouvez maintenant utiliser l\'application.';
            document.querySelector('.alert').className = 'alert alert-success mb-4';
            document.querySelector('.spinner-border').style.display = 'none';
          }
        })
        .catch(error => {
          document.querySelector('.alert').innerHTML = 
            '<i class="fas fa-exclamation-triangle me-2"></i><strong>Erreur de connexion.</strong> Vérifiez que le serveur backend est démarré.';
          document.querySelector('.alert').className = 'alert alert-danger mb-4';
          document.querySelector('.spinner-border').style.display = 'none';
        });
    }, 2000);
  </script>
</body>
</html>
